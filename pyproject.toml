[project]
name = "rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ansh Rohilla", email = "anshrohilla.b81@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.1.7",
    "google-genai>=2.17.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
rag-eval = "rag_eval:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
